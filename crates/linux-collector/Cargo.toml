[package]
name = "linux-collector"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Linux implementation of the platform signal collector: X11 (EWMH active window, XScreenSaver idle) and Hyprland (IPC) active-window backends, evdev-based input-event counting shared by both, DE-agnostic session/power via logind D-Bus. GNOME and KDE Plasma (Wayland) work through their own companion components (a Shell extension and a KWin script) and report an explicit unsupported status while those aren't loaded (see docs/02_ARCHITECTURE/AGENT_LINUX_CAPABILITY_MATRIX.md)."

[dependencies]
collector-core = { path = "../collector-core" }
lifecycle = { path = "../lifecycle" }
normalization = { path = "../normalization" }
thiserror = "1"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["screensaver"] }
zbus = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
